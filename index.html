<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper App Dungeon Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            .print-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(2, 1fr);
                gap: 10mm;
                page-break-inside: avoid;
                height: 100vh;
                box-sizing: border-box;
                padding: 5mm;
            }
            .page-break {
                page-break-after: always;
                break-after: page;
            }
        }
        .dungeon-grid {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            grid-template-rows: repeat(12, minmax(0, 1fr));
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen flex flex-col">

    <!-- Header / Controls (Hidden on Print) -->
    <header class="no-print bg-slate-900 text-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold tracking-wider flex items-center gap-2">
                    <span>🏰</span> Paper App Dungeon Generator
                </h1>
                <p class="text-xs text-slate-400">Rulebook-Accurate SVG Icons & Up to 50-Floor Campaigns</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                    <label class="text-xs text-slate-300">Master Seed:</label>
                    <input type="text" id="masterSeedInput" value="a4f9c2b3e8" class="bg-slate-900 text-amber-400 font-mono text-sm px-2 py-0.5 rounded w-28 outline-none border border-slate-700">
                    <button onclick="randomizeSeed()" class="text-slate-400 hover:text-white text-xs px-1" title="Randomize Seed">🎲</button>
                </div>

                <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                    <label class="text-xs text-slate-300">Floors (1-50):</label>
                    <input type="number" id="totalFloorsInput" min="1" max="50" value="10" class="bg-slate-900 text-amber-400 font-mono text-sm px-2 py-0.5 rounded w-16 outline-none border border-slate-700">
                </div>

                <button onclick="generateCampaign()" class="bg-amber-600 hover:bg-amber-500 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
                    🔄 Generate
                </button>

                <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
                    🖨️ Print / PDF (4-up)
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6">
        <div id="campaignContainer" class="space-y-12">
            <!-- Dynamically generated floors will appear here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="no-print bg-slate-900 text-slate-400 text-xs py-4 text-center border-t border-slate-800">
        Paper App Dungeon • Netlify Edition with Custom SVG Rulebook Icons
    </footer>

    <!-- Script Engine -->
    <script>
        // MD5-based PRNG for isolated streams per floor
        function getFloorRNG(masterSeed, floorNum, streamType) {
            let str = `${masterSeed}:floor:${floorNum}:${streamType}`;
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            let seed = Math.abs(hash);
            return function() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            };
        }

        function randomizeSeed() {
            const chars = "abcdef0123456789";
            let s = "";
            for(let i=0; i<10; i++) s += chars[Math.floor(Math.random() * chars.length)];
            document.getElementById('masterSeedInput').value = s;
            generateCampaign();
        }

        // Custom Rulebook-Accurate SVG Icons
        function renderEntityIcon(type, data) {
            switch(type) {
                case 'start': // Smiley face starting node ☺
                    return `<div class="w-6 h-6 rounded-full border-2 border-slate-800 bg-white flex items-center justify-center text-[11px] font-bold shadow-sm">☺</div>`;
                
                case 'stairs': // Exit staircase
                    return `<div class="w-6 h-6 border border-slate-800 bg-slate-200 flex flex-col justify-between p-0.5 rounded"><div class="h-1 bg-slate-800 w-full"></div><div class="h-1 bg-slate-800 w-2/3"></div><div class="h-1 bg-slate-800 w-1/3"></div></div>`;
                
                case 'coin': // Coin ¢
                    return `<div class="w-5 h-5 rounded-full border border-slate-800 bg-amber-300 flex items-center justify-center text-[9px] font-black text-amber-950 shadow-sm">¢</div>`;
                
                case 'chest': // Mystery Treasure Chest ?
                    return `<div class="w-5 h-5 rounded border border-slate-800 bg-amber-100 flex items-center justify-center text-[9px] font-bold text-amber-900 shadow-sm">⬢?</div>`;
                
                case 'monster': // Bug with Thorax Number
                    return `<div class="w-6 h-6 rounded border border-slate-800 bg-rose-100 flex items-center justify-center relative shadow-sm">
                        <svg class="absolute inset-w-full inset-h-full text-rose-300 opacity-60" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
                        <span class="text-[11px] font-black text-rose-950 z-10">${data.tier}</span>
                    </div>`;
                
                case 'mystery_monster': // Mystery Bug
                    return `<div class="w-6 h-6 rounded border border-slate-800 bg-purple-100 flex items-center justify-center text-[11px] font-black text-purple-950 shadow-sm">?</div>`;
                
                case 'heart': // Heart HP
                    return `<div class="w-5 h-5 text-rose-600 flex items-center justify-center"><svg viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>`;
                
                case 'mystery_heart': // Mystery Heart
                    return `<div class="w-6 h-6 rounded-full border border-rose-400 bg-rose-50 flex items-center justify-center text-[9px] font-bold text-rose-800 shadow-sm">♥?</div>`;
                
                case 'spiderweb': // Cobweb trap
                    return `<div class="w-5 h-5 text-slate-600 flex items-center justify-center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="12" y1="3" x2="12" y2="21"/></svg></div>`;
                
                case 'teleporter': // Teleporter swirl ☯
                    return `<div class="w-5 h-5 rounded-full border border-cyan-600 bg-cyan-50 flex items-center justify-center text-[10px] text-cyan-800 font-bold shadow-sm">🌀</div>`;
                
                case 'key': // Key
                    return `<div class="w-5 h-5 text-amber-700 flex items-center justify-center text-xs">🔑</div>`;
                
                default:
                    return `<div class="w-1.5 h-1.5 rounded-full bg-slate-300"></div>`;
            }
        }

        function generateFloorHTML(floorNum, masterSeed) {
            const rngLayout = getFloorRNG(masterSeed, floorNum, 'layout');
            const rngContent = getFloorRNG(masterSeed, floorNum, 'content');

            const gridWidth = 12;
            const gridHeight = 12;
            
            const startX = Math.floor(rngLayout() * gridWidth);
            const startY = Math.floor(rngLayout() * 3);
            const endX = Math.floor(rngLayout() * gridWidth);
            const endY = Math.floor(gridHeight - 1 - rngLayout() * 3);

            let entities = [];
            entities.push({x: startX, y: startY, type: 'start'});
            entities.push({x: endX, y: endY, type: 'stairs'});

            const entityTypes = ['coin', 'coin', 'monster', 'monster', 'chest', 'heart', 'spiderweb', 'mystery_monster', 'teleporter', 'key'];
            const count = 12 + Math.floor(rngContent() * 5);
            
            for(let i=0; i<count; i++) {
                let ex = Math.floor(rngContent() * gridWidth);
                let ey = Math.floor(rngContent() * gridHeight);
                if((ex === startX && ey === startY) || (ex === endX && ey === endY)) continue;
                
                let type = entityTypes[Math.floor(rngContent() * entityTypes.length)];
                let data = {};
                if(type === 'monster') {
                    data.tier = Math.min(6, Math.max(1, Math.floor(rngContent() * (floorNum > 5 ? 6 : 4)) + 1));
                }
                entities.push({x: ex, y: ey, type: type, ...data});
            }

            let gridCellsHTML = '';
            for(let y=0; y<gridHeight; y++) {
                for(let x=0; x<gridWidth; x++) {
                    let matched = entities.filter(e => e.x === x && e.y === y);
                    let content = '';
                    if(matched.length > 0) {
                        content = renderEntityIcon(matched[0].type, matched[0]);
                    } else {
                        content = `<div class="w-1 h-1 rounded-full bg-slate-300 opacity-70"></div>`;
                    }
                    gridCellsHTML += `<div class="border border-slate-200/80 flex items-center justify-center aspect-square">${content}</div>`;
                }
            }

            return `
                <div class="bg-white border-2 border-slate-300 rounded-xl shadow-sm p-3.5 flex flex-col justify-between h-[610px] relative">
                    <!-- Floor Header -->
                    <div class="flex justify-between items-center border-b border-slate-200 pb-1.5 mb-2">
                        <h2 class="text-sm font-black text-slate-800 tracking-wider">Floor ${floorNum}</h2>
                        <span class="text-[9px] font-mono text-slate-400">Seed: ${masterSeed.substring(0,6)}</span>
                    </div>

                    <!-- 12x12 Dungeon Grid -->
                    <div class="dungeon-grid border border-slate-300 bg-slate-50/50 rounded p-0.5 flex-1">
                        ${gridCellsHTML}
                    </div>

                    <!-- Rulebook Stat Tracking Quadrants -->
                    <div class="grid grid-cols-4 gap-1.5 mt-2.5 pt-2.5 border-t border-slate-200 text-center">
                        <div class="bg-slate-50 border border-slate-200 rounded p-1">
                            <div class="text-[8px] font-bold text-slate-500 uppercase">Starting</div>
                            <div class="text-[11px] font-mono font-bold mt-0.5">HP: 10</div>
                            <div class="text-[9px] font-mono text-amber-700">¢: 0</div>
                        </div>
                        <div class="bg-slate-50 border border-slate-200 rounded p-1">
                            <div class="text-[8px] font-bold text-slate-500 uppercase">+ Gain</div>
                            <div class="h-5 border-b border-dashed border-slate-300"></div>
                        </div>
                        <div class="bg-slate-50 border border-slate-200 rounded p-1">
                            <div class="text-[8px] font-bold text-slate-500 uppercase">- Loss</div>
                            <div class="h-5 border-b border-dashed border-slate-300"></div>
                        </div>
                        <div class="bg-slate-50 border border-slate-200 rounded p-1">
                            <div class="text-[8px] font-bold text-slate-500 uppercase">Ending</div>
                            <div class="text-[11px] font-mono font-bold mt-0.5">/ HP</div>
                            <div class="text-[9px] font-mono text-amber-700">¢</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function generateCampaign() {
            const masterSeed = document.getElementById('masterSeedInput').value.trim() || 'a4f9c2b3e8';
            const totalFloors = parseInt(document.getElementById('totalFloorsInput').value) || 10;
            const container = document.getElementById('campaignContainer');
            
            container.innerHTML = '';

            let htmlContent = '';
            for(let f=1; f<=totalFloors; f++) {
                if((f - 1) % 4 === 0) {
                    if(f > 1) htmlContent += `</div></div>`; // Close previous page
                    htmlContent += `<div class="print-grid page-break"><div class="contents">`;
                }
                htmlContent += generateFloorHTML(f, masterSeed);
            }
            htmlContent += `</div></div>`; // Close final page
            
            container.innerHTML = htmlContent;
        }

        window.onload = generateCampaign;
    </script>
</body>
</html>
